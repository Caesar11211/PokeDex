# Rebuilds the app's Top cards list and saves it to the site (data/top-cards.json).
# Runs twice a week; you can also run it by hand: Actions tab → "Update top cards" → Run workflow.
name: Update top cards

on:
  schedule:
    - cron: "17 5 * * 1,4"    # Mondays and Thursdays at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write              # lets it save the list back to the repository

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the list
        run: node scripts/top-cards.mjs
      - name: Save it to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/top-cards.json
          git diff --staged --quiet || (git commit -m "Update top cards list" && git push)
