<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Living Dex</title>
  <meta name="description" content="Scan Pokémon cards into a 1,025-slot living Pokédex binder with TCGplayer prices.">
  <meta name="theme-color" content="#d3202f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Living Dex">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
  <style>
/* Living Dex — a field Pokédex device: a red shell, a dark pixel screen for your progress,
   and a binder whose empty slots are tinted with each Pokémon's type colours. */
:root {
  --paper: #eef0f3; --panel: #ffffff; --sunk: #f4f5f8; --line: #d9dde3;
  --ink: #1b2230; --muted: #616a79;
  --red: #d3202f; --red-deep: #9e1525; --red-ink: #ffffff;
  --screen: #1d2938; --screen-edge: #2b3a4e; --glow: #e8f4e4; --glow-dim: #9db0a6; --amber: #ffd54a; --lime: #8be28f;
  --got: #22874f; --got-soft: #e1f2e7; --gold: #b7860b; --warn: #c2361f;
  --px: "Pixelify Sans", ui-monospace, "SF Mono", Menlo, monospace;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shell-h: calc(56px + env(safe-area-inset-top, 0px));
  --tab-h: calc(64px + env(safe-area-inset-bottom, 0px));
  /* names older parts of the app use */
  --bg: var(--paper); --sheet: var(--panel); --sleeve: var(--sunk); --accent: var(--red); --accent-ink: var(--red-ink);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0f1319; --panel: #181e27; --sunk: #212834; --line: #2f3846;
    --ink: #e7ebf1; --muted: #98a2b2;
    --red: #c81d2c; --red-deep: #7a0f1a;
    --screen: #0b1017; --screen-edge: #1f2a37;
    --got: #48c27f; --got-soft: #15301f; --gold: #e1b53e; --warn: #ff6a52;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }
body { color: var(--ink); font: 15px/1.45 var(--body); padding-bottom: calc(var(--tab-h) + 24px); -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.px, .num { font-family: var(--px); font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.wrap { max-width: 860px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }

/* ---------- The device shell ---------- */
.shell { position: sticky; top: 0; z-index: 25; background: linear-gradient(180deg, var(--red) 0%, color-mix(in srgb, var(--red) 88%, #000) 100%);
  border-bottom: 3px solid var(--red-deep); color: var(--red-ink); padding-top: env(safe-area-inset-top, 0px); }
.shell-in { max-width: 860px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.lamp { width: 20px; height: 20px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 30%, #e6f6ff 0 18%, #5cb8f2 40%, #1d6fb8 100%);
  box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--red-deep); }
body.busy .lamp { animation: lamp 1s steps(2) infinite; }
@keyframes lamp { 50% { filter: brightness(1.6) saturate(1.3); } }
.brand { font: 700 19px/1 var(--px); letter-spacing: .01em; white-space: nowrap; }
.collpick { border: 0; background: rgba(255,255,255,.17); color: #fff; border-radius: 999px; padding: 5px 12px 5px 12px; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.collpick::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 7px; vertical-align: 2px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.shellbtn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: #fff; display: grid; place-items: center; flex: none; }
.shellbtn svg { width: 20px; height: 20px; }
@media (max-width: 370px) { .brand { display: none; } }

/* ---------- The screen ---------- */
.screen { background: var(--screen); color: var(--glow); border-radius: 14px; padding: 12px 16px 11px; position: relative; overflow: hidden;
  box-shadow: inset 0 0 0 3px var(--screen-edge), inset 0 8px 24px rgba(0,0,0,.35); }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
.screen p { margin: 0; }
.scr-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.scr-caught .px { font-size: 34px; line-height: 1; }
.scr-value { text-align: right; }
.scr-value .px { font-size: 26px; line-height: 1; color: var(--amber); display: block; }
.scr-of { font-size: 13px; color: var(--glow-dim); margin-left: 4px; }
.scr-value .scr-of { margin: 2px 0 0; display: block; }
.meter { height: 8px; margin: 10px 0 8px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; transition: width .5s steps(12);
  background: repeating-linear-gradient(90deg, var(--lime) 0 6px, color-mix(in srgb, var(--lime) 70%, #000) 6px 8px); }
.scr-foot { font-size: 12.5px; color: var(--glow-dim); }
.scr-foot span { color: var(--glow); }
#subTxt { display: block; color: var(--amber); margin-top: 3px; }
#subTxt:empty { display: none; }

.notice { background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }

/* ---------- Toolbar: tab sections, search, filters ---------- */
.toolbar { display: flex; flex-direction: column; gap: 8px; }
.seg { display: flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12), inset 0 -2px 0 var(--red); }
.seg.mini { display: inline-flex; }
.seg.mini button { flex: none; padding: 5px 11px; font-size: 12.5px; }
.findbar { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 4px 4px 12px; }
.findbar > svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.findbar input { flex: 1; min-width: 0; border: 0; background: none; padding: 7px 0; font-size: 16px; outline: none; }
.findbar input::placeholder { color: var(--muted); }
.findbar:focus-within { border-color: var(--ink); }
.filterbtn { position: relative; width: 38px; height: 38px; border: 0; border-radius: 9px; background: var(--sunk); display: grid; place-items: center; color: var(--ink); flex: none; }
.filterbtn svg { width: 20px; height: 20px; }
.fcount { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--red); color: #fff; font: 600 11px/18px var(--px); text-align: center; }
.viewbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.textbtn { border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 6px 4px; }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: 1 1 100%; }
.progress i { display: block; height: 100%; background: var(--got); width: 0; transition: width .2s; }
.switch { display: inline-flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 0; font-size: 14px; font-weight: 600; text-align: left; }
.switch .knob { width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch[aria-pressed="true"] .knob { background: var(--red); }
.switch[aria-pressed="true"] .knob::after { transform: translateX(16px); }

/* ---------- Binder ---------- */
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px; }
.page { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
body:not([data-coll="en"]) .page { border-top: 3px solid var(--red); }
.page h2 { margin: 0 2px 8px; display: flex; justify-content: space-between; align-items: baseline; font: 600 15px/1.2 var(--px); }
.page h2 .num { font: 500 12px var(--body); color: var(--muted); }
.grid9 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.flat { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; }
.slot { --t1: #a8a77a; --t2: var(--t1); position: relative; aspect-ratio: 63 / 88; max-width: 100%; min-width: 0; overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--t1) 35%, var(--line)); border-radius: 8px;
  background: color-mix(in srgb, var(--t1) 13%, var(--panel));
  display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 9px 6px 6px; text-align: left; }
.slot::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--t1) 50%, var(--t2) 50%); }
.slot .sn { font: 600 13px/1 var(--px); color: color-mix(in srgb, var(--t1) 55%, var(--ink)); }
.slot .nm { font-size: 11.5px; font-weight: 600; line-height: 1.15; color: var(--muted); overflow-wrap: anywhere; }
.slot.legend::after { content: ""; position: absolute; top: 10px; right: 6px; width: 7px; height: 7px; transform: rotate(45deg); background: var(--gold); z-index: 1; }
.slot.wish { border: 1.5px dashed var(--red); }
.slot.wish .sn { color: var(--red); }
.slot.got { background: var(--got-soft); border: 1.5px solid var(--got); }
.slot.got .sn { color: var(--got); }
.slot.got .nm { color: var(--ink); }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot.hasimg { padding: 0; border-color: transparent; background: var(--sunk); }
.slot.hasimg::before, .slot.hasimg .sn, .slot.hasimg .nm { display: none; }
.slot .badge { position: absolute; z-index: 1; bottom: 5px; font: 600 10.5px/1.5 var(--px); border-radius: 4px; padding: 0 4px; }
.slot .spare { right: 5px; background: var(--ink); color: var(--paper); }
.slot .val { left: 5px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
.empty { color: var(--muted); text-align: center; padding: 40px 10px; }

/* ---------- Bottom bar ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
  background: var(--panel); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar button { position: relative; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: var(--muted); font-size: 11.5px; font-weight: 600; }
.tabbar button svg { width: 23px; height: 23px; }
.tabbar button[aria-pressed="true"] { color: var(--red); }
.tabbar button[aria-pressed="true"] span { font-weight: 700; }
.tcount { position: absolute; top: 0; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--red); color: #fff; font: 600 10.5px/17px var(--px); }
.tcount:empty { display: none; }
.tabbar .scanbtn { color: var(--red); }
.tabbar .scanbtn svg { width: 58px; height: 58px; padding: 14px; margin-top: -30px; border-radius: 50%; background: var(--red); color: #fff;
  box-shadow: 0 0 0 4px var(--panel), 0 0 0 6px var(--red-deep), 0 6px 14px rgba(160, 20, 35, .35); }
.tabbar .scanbtn.rapid svg { background: var(--red-deep); box-shadow: 0 0 0 4px var(--panel), 0 0 0 6px var(--amber), 0 6px 14px rgba(160, 20, 35, .35); }

/* ---------- Sheets ---------- */
.backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(10,14,22,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--panel); width: min(560px, 100%); max-height: 92%; overflow: auto; overscroll-behavior: contain; border-radius: 18px 18px 0 0;
  padding: 0 max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) { .backdrop { align-items: center; } .sheet { border-radius: 18px; } }
.sheet-top { position: sticky; top: 0; z-index: 2; background: var(--panel); margin: 0 -18px; padding: 16px 18px 10px; display: flex; flex-direction: column; gap: 6px; }
.sheet-top.typed { border-top: 5px solid var(--t1); background: linear-gradient(180deg, color-mix(in srgb, var(--t1) 14%, var(--panel)), var(--panel) 90%); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet h3 { margin: 0; font: 600 21px/1.15 var(--px); }
.sheet h4 { margin: 0; font: 600 15px/1.2 var(--px); color: var(--ink); }
.x { border: 0; background: var(--sunk); border-radius: 50%; width: 34px; height: 34px; font-size: 18px; line-height: 1; flex: none; }
.tchips { display: flex; gap: 5px; flex-wrap: wrap; }
.tchip { background: var(--c); color: var(--cink); border-radius: 5px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
.sheet .actions.sticky { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); z-index: 2; margin: 0 -18px calc(-18px - env(safe-area-inset-bottom, 0px));
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--line); }
.photo { display: flex; gap: 14px; align-items: flex-start; }
.photo img { width: 88px; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); flex: none; }
.status { font-size: 14px; color: var(--muted); min-width: 0; margin: 0; }
.status.ok { color: var(--got); } .status.warn { color: var(--warn); }
.dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.searchrow { display: grid; grid-template-columns: 1fr 92px auto; gap: 8px; align-items: end; }
form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); min-width: 0; }
label input, label textarea, label select { background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; font-size: 16px; font-weight: 400; color: var(--ink); width: 100%; }
label textarea { resize: vertical; min-height: 54px; }
.full { grid-column: 1 / -1; }
.more { border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.more summary { padding: 11px 0; font-weight: 600; font-size: 14px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: "+"; font: 600 18px/1 var(--px); color: var(--muted); }
.more[open] summary::after { content: "–"; }
.more[open] { padding-bottom: 12px; }
#manualRow input { border-color: var(--red); }
.match { font-size: 13px; color: var(--muted); margin: 0; } .match b { color: var(--ink); }
.pricelink { color: var(--red); font-weight: 600; text-underline-offset: 3px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 10px 18px; font-weight: 600; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.go { background: var(--red); color: #fff; border-color: var(--red); font: 600 16px var(--px); padding: 11px 22px; }
.btn.danger { color: var(--warn); border-color: var(--warn); }
.dupe { background: var(--sunk); border-radius: 10px; padding: 12px; font-size: 14px; display: flex; flex-direction: column; gap: 10px; }
.setting { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; padding-bottom: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + 16px); z-index: 40; background: var(--ink); color: var(--paper);
  padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); }

/* Collection list and the filter sheet */
.colllist { display: flex; flex-direction: column; gap: 8px; }
.collrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; text-align: left; }
.collrow b { font: 600 17px var(--px); display: block; }
.collrow small { color: var(--muted); font-size: 12.5px; }
.collrow .px { font-size: 15px; color: var(--muted); white-space: nowrap; }
.collrow[aria-pressed="true"] { border: 2px solid var(--red); }
.regiongrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.reg { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 8px 6px; text-align: left; }
.reg[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.reg .rn { display: block; font-weight: 600; font-size: 13px; }
.reg .rc { display: block; font: 500 12px var(--px); color: var(--muted); }
.reg .bar { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-top: 5px; overflow: hidden; }
.reg .bar i { display: block; height: 100%; background: var(--got); }
.optrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.optrow select { background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 15px; color: var(--ink); }

/* Card picker and chosen card */
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.pick { border: 2px solid transparent; background: var(--sunk); border-radius: 9px; padding: 4px; display: flex; flex-direction: column; gap: 3px; text-align: left; font-size: 11px; color: var(--muted); min-width: 0; }
.pick img { width: 100%; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 5px; background: var(--line); }
.pick b { color: var(--ink); font: 600 12.5px var(--px); }
.pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick[aria-pressed="true"] { border-color: var(--red); }
.pick .tag { font-size: 10.5px; font-weight: 700; }
.pick.mine { border-color: var(--got); background: var(--got-soft); }
.pick.mine .tag { color: var(--got); }
.pick.binder { border-color: var(--got); box-shadow: inset 0 0 0 1px var(--got); }
.chosen { display: grid; grid-template-columns: 104px 1fr; gap: 14px; align-items: start; background: var(--sunk); border-radius: 12px; padding: 12px; }
.chosen img { width: 104px; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 7px; }
.chosen .cn { font: 600 17px/1.2 var(--px); }
.chosen .meta { color: var(--muted); font-size: 12.5px; }
.price { font: 700 26px/1.1 var(--px); margin-top: 6px; }
.price small { font: 500 12px var(--body); color: var(--muted); display: block; margin-top: 2px; }
.finish { display: inline-flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.finish button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.edask { margin-top: 8px; padding: 10px 12px; border: 2px solid var(--amber); border-radius: 12px; background: var(--panel); }
.edask p { margin: 4px 0 8px; font-size: 12.5px; color: var(--muted); }
.edbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.edbtns button { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px; font-weight: 700; color: var(--ink); text-align: left; }
.edbtns small { display: block; font-weight: 500; color: var(--muted); margin-top: 2px; }
.finish button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.graded { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.graded b { color: var(--ink); font-family: var(--px); font-weight: 600; }

.wishrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--sunk); border-radius: 10px; padding: 10px 12px; }
.wishbtn { border: 1.5px dashed var(--red); background: none; color: var(--red); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13px; }
.wishbtn[aria-pressed="true"] { background: var(--red); color: #fff; border-style: solid; }
.wishrow label { flex-direction: row; align-items: center; gap: 8px; }
.wishrow input { width: 90px; }
.added { display: flex; gap: 14px; align-items: center; }
.added img { width: 84px; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 7px; flex: none; }
.added b { font: 600 18px var(--px); display: block; }
.sparelist { width: 100%; min-height: 200px; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 10px; font-size: 13px; color: var(--ink); resize: vertical; }

/* ---------- Panels: Stats, Value, Wishlist ---------- */
.stats-view { display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h2 { margin: 0; font: 600 18px/1.2 var(--px); }
.panel .lede { margin: 0; color: var(--muted); font-size: 13px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); stroke: none; font-size: 11px; font-family: var(--body); }
.chart .series { fill: none; stroke: var(--got); stroke-width: 2; }
.chart .area { fill: var(--got); stroke: none; opacity: .12; }
.chart .pt { fill: var(--got); stroke: none; }
.chart .endpoint { fill: var(--got); stroke: var(--panel); stroke-width: 2; }
.chart .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .tip { position: absolute; top: -6px; transform: translate(-50%, -100%); background: var(--ink); color: var(--paper); border-radius: 8px; padding: 5px 9px; font-size: 12px; white-space: nowrap; pointer-events: none; z-index: 3; }
.chart .tip b { font: 600 14px var(--px); display: block; }
.pchart { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; min-width: 0; }
.movers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) { .movers { grid-template-columns: 1fr; } }
.movers h3 { margin: 0 0 6px; font: 600 14px var(--px); color: var(--muted); }
.mover { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.mover img, .mover .noimg { width: 36px; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 4px; background: var(--sunk); display: block; }
.mover .mn { font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mover .ms { color: var(--muted); font-size: 12px; }
.mover .delta { font: 600 14px var(--px); text-align: right; }
.delta.up { color: var(--got); } .delta.down { color: var(--warn); }
.delta small { display: block; font: 500 11px var(--body); color: var(--muted); }
.months { display: flex; flex-direction: column; gap: 8px; }
.month { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: center; font-size: 13px; }
.month .ml { color: var(--muted); }
.month .bars { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.month .bar { display: flex; align-items: center; gap: 8px; }
.month .bar i { display: block; height: 8px; border-radius: 0 4px 4px 0; min-width: 2px; }
.month .bar.spent i { background: var(--muted); }
.month .bar.worth i { background: var(--got); }
.month .bar span { font: 500 12px var(--px); white-space: nowrap; }
.key { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.badge-card { border: 1px dashed var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; color: var(--muted); }
.badge-card b { font: 600 14px var(--px); color: var(--muted); }
.badge-card small { font-size: 12px; }
.badge-card.earned { border: 1px solid var(--got); background: var(--got-soft); }
.badge-card.earned b { color: var(--ink); }
.badge-card .prog { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 6px; }
.badge-card .prog i { display: block; height: 100%; background: var(--got); }
.rows { display: flex; flex-direction: column; }
.row-item { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; color: inherit; }
.row-item:first-child { border-top: 0; }
.row-item img, .row-item .noimg { width: 44px; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 5px; background: var(--sunk); display: block; }
.row-item .rt { font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.row-item .rs { color: var(--muted); font-size: 12px; line-height: 1.35; }
.row-item .rv { font: 700 15px var(--px); text-align: right; white-space: nowrap; }
.row-item .rv small { display: block; font: 500 11px var(--body); color: var(--muted); }
.row-item .rank { font: 500 13px var(--px); color: var(--muted); }
.rv.up { color: var(--got); } .rv.down { color: var(--muted); }
.chip { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 1px; }
.chip.deal { background: var(--red); color: #fff; }
.chip.own { background: var(--got-soft); color: var(--got); border: 1px solid var(--got); }
.chip.have { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.chip.warn { background: var(--sunk); color: var(--warn); border: 1px dashed var(--warn); }
.costrow { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-direction: row; }
.costrow input { width: 84px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 16px; color: var(--ink); }

/* ---------- Crop step: a camera screen, dark in both themes ---------- */
.cropper { position: fixed; inset: 0; z-index: 35; background: #0b0e14; color: #fff; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.crop-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px 4px; font: 600 18px var(--px); }
.crop-top .x { background: rgba(255,255,255,.14); color: #fff; }
.crop-hint { color: rgba(255,255,255,.72); font-size: 13px; margin: 0 16px 6px; min-height: 1.4em; }
.crop-hint.found { color: #7be0a6; }
#cropCv { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; cursor: grab; }
.crop-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 12px 16px 16px; }
.crop-bar .btn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); color: #fff; }
.crop-bar .btn.primary { background: #d3202f; border-color: #d3202f; color: #fff; }

@media (prefers-reduced-motion: reduce) {
  .dots::after { animation: none; content: "…"; }
  body.busy .lamp { animation: none; }

}
.chart rect { stroke: none; }
.slot:has(.val) .nm { margin-bottom: 17px; }

</header>

<main class="wrap">
  <!-- The screen: progress and value at a glance -->
  <section class="screen" aria-label="Collection progress">
