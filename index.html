  <style>
/* Living Dex — a binder you flip through: 3×3 sleeve pages in Dex order, with the scan button under your thumb. */
:root {
  --bg: #eef0f3; --sheet: #ffffff; --sleeve: #f6f7f9; --line: #d7dbe2;
  --ink: #1b2333; --muted: #677184; --accent: #e2382a; --accent-ink: #ffffff;
  --got: #1f8a5b; --got-soft: #e3f3ea; --gold: #b7860b;
  --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 1px 2px rgba(27,35,51,.08), 0 4px 14px rgba(27,35,51,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161f; --sheet: #1a202c; --sleeve: #222937; --line: #313a4b;
    --ink: #e8ebf2; --muted: #98a2b6; --accent: #ff5a47; --accent-ink: #1a0d0b;
    --got: #4cc38a; --got-soft: #17352a; --gold: #e1b53e;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { background: var(--bg); margin: 0; }
body {
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 130px max(16px, env(safe-area-inset-left, 0px));
  -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }

/* Header readout */
header { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.ring { width: 88px; height: 88px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); } .ring .fill { stroke: var(--got); transition: stroke-dashoffset .6s ease; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 20px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; }
.worth { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 10px; }
.worth strong { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1; color: var(--got); }
.worth span { color: var(--muted); font-size: 13px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.stats strong { color: var(--ink); font-family: var(--display); font-size: 15px; font-weight: 600; }
.gear { align-self: start; border: 1px solid var(--line); background: var(--sheet); border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center; }
.gear svg { width: 20px; height: 20px; }
@media (max-width: 480px) { header { grid-template-columns: auto 1fr; } .gear { grid-column: 2; grid-row: 1; justify-self: end; } header > div:not(.ring) { grid-column: 1 / -1; } }

.notice { background: var(--sheet); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }

/* Region strip */
.regions { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
.reg { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 7px 4px 6px; text-align: center; font-size: 11px; line-height: 1.2; }
.reg[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.reg .rn { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reg .rc { display: block; font-family: var(--display); color: var(--muted); }
.reg .bar { display: block; height: 3px; border-radius: 2px; background: var(--line); margin-top: 5px; overflow: hidden; }
.reg .bar i { display: block; height: 100%; background: var(--got); }
@media (max-width: 560px) { .regions { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.reg.all .rn { font-family: var(--display); }

/* Controls */
.controls { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.segwrap { overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.segwrap::-webkit-scrollbar { display: none; }
.seg { display: inline-flex; background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; padding: 3px; white-space: nowrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg .count { font-family: var(--display); font-weight: 500; opacity: .75; margin-left: 4px; }
.search { flex: 1 1 160px; min-width: 0; background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 16px; }
.typesel { background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font-size: 14px; max-width: 150px; }
.textbtn { border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 6px 4px; }
.switch { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 2px; font-size: 13px; font-weight: 600; }
.switch .knob { width: 36px; height: 20px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; }
.switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--sheet); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-pressed="true"] .knob { background: var(--accent); }
.switch[aria-pressed="true"] .knob::after { transform: translateX(16px); }
.spacer { flex: 1; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: 1 1 100%; }
.progress i { display: block; height: 100%; background: var(--got); width: 0; transition: width .2s; }

/* Binder pages */
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 18px; }
.page { background: var(--sheet); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; }
.page h2 { margin: 0 2px 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.grid9 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.flat { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.slot { position: relative; aspect-ratio: 63 / 88; max-width: 100%; border: 1px solid var(--line); border-radius: 7px; background: var(--sleeve);
  display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 6px; text-align: left; overflow: hidden; min-width: 0; }
.slot .sn { font-family: var(--display); font-size: 11px; color: var(--muted); }
.slot .nm { font-size: 11px; font-weight: 600; line-height: 1.15; color: var(--muted); overflow-wrap: anywhere; }
.slot.legend::after { content: ""; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); z-index: 1; }
.slot.wish { border: 1.5px dashed var(--accent); }
.slot.wish .sn { color: var(--accent); }
.slot.got { background: var(--got-soft); border: 1px solid var(--got); }
.slot.got .nm { color: var(--ink); }
.slot.got .sn { color: var(--got); }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot.hasimg { padding: 0; border-color: transparent; background: var(--sleeve); }
.slot.hasimg .sn, .slot.hasimg .nm { display: none; }
.slot .badge { position: absolute; z-index: 1; bottom: 5px; font-family: var(--display); font-size: 10px; border-radius: 4px; padding: 0 4px; }
.slot .spare { right: 5px; background: var(--ink); color: var(--bg); }
.slot .val { left: 5px; background: var(--sheet); color: var(--ink); border: 1px solid var(--line); }
.empty { color: var(--muted); text-align: center; padding: 40px 10px; }

/* Scan bar */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 10px;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 60%, transparent); }
.scan { display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
  padding: 14px 26px; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .03em; box-shadow: 0 6px 20px rgba(226,56,42,.3); }
.scan svg { width: 22px; height: 22px; }
.ghost { background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; padding: 14px 18px; font-weight: 600; }

/* Sheet */
.backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(10,14,22,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--sheet); width: min(560px, 100%); max-height: 92%; overflow: auto; border-radius: 18px 18px 0 0;
  padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) { .backdrop { align-items: center; } .sheet { border-radius: 18px; } }
.sheet h3 { margin: 0; font-family: var(--display); font-size: 20px; }
.sheet h4 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.x { border: 0; background: var(--sleeve); border-radius: 50%; width: 34px; height: 34px; font-size: 18px; line-height: 1; flex: none; }
.photo { display: flex; gap: 14px; align-items: flex-start; }
.photo img { width: 96px; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); flex: none; }
.status { font-size: 14px; color: var(--muted); min-width: 0; margin: 0; }
.status.ok { color: var(--got); } .status.warn { color: var(--accent); }
.dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
@media (prefers-reduced-motion: reduce) { .dots::after { animation: none; content: "…"; } .ring .fill, .switch .knob, .switch .knob::after, .progress i { transition: none; } }
.searchrow { display: grid; grid-template-columns: 1fr 96px auto; gap: 8px; align-items: end; }
form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; min-width: 0; }
label input, label textarea, label select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 16px; font-weight: 400; color: var(--ink); width: 100%; }
label textarea { resize: vertical; min-height: 54px; }
.full { grid-column: 1 / -1; }
.match { font-size: 13px; color: var(--muted); margin: 0; } .match b { color: var(--ink); }
.pricelink { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 10px 18px; font-weight: 600; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-family: var(--display); font-size: 16px; padding: 12px 22px; }
.btn.danger { color: var(--accent); border-color: var(--accent); }
.dupe { background: var(--sleeve); border-radius: 10px; padding: 12px; font-size: 14px; display: flex; flex-direction: column; gap: 10px; }

/* Card picker */
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.pick { border: 2px solid transparent; background: var(--sleeve); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; gap: 3px; text-align: left; font-size: 11px; color: var(--muted); min-width: 0; }
.pick img { width: 100%; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 5px; background: var(--line); }
.pick b { color: var(--ink); font-family: var(--display); font-size: 12px; font-weight: 600; }
.pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick[aria-pressed="true"] { border-color: var(--accent); }
.chosen { display: grid; grid-template-columns: 110px 1fr; gap: 14px; align-items: start; background: var(--sleeve); border-radius: 12px; padding: 12px; }
.chosen img { width: 110px; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 7px; }
.chosen .cn { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.2; }
.chosen .meta { color: var(--muted); font-size: 13px; }
.price { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.1; margin-top: 6px; }
.price small { font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--muted); display: block; }
.finish { display: inline-flex; gap: 4px; margin-top: 8px; }
.finish button { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.finish button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.wishrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--sleeve); border-radius: 10px; padding: 10px 12px; }
.wishbtn { border: 1.5px dashed var(--accent); background: none; color: var(--accent); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13px; }
.wishbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-style: solid; }
.wishrow label { flex-direction: row; align-items: center; gap: 8px; }
.wishrow input { width: 90px; }
.added { display: flex; gap: 14px; align-items: center; }
.added img { width: 84px; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 7px; flex: none; }
.added b { font-family: var(--display); font-size: 18px; display: block; }
.sparelist { width: 100%; min-height: 200px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: var(--ink); resize: vertical; }
.setting { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; padding-bottom: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }

/* Crop step: camera-style screen, dark in both themes */
.cropper { position: fixed; inset: 0; z-index: 35; background: #0b0e14; color: #fff; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.crop-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px 4px; font-family: var(--display); font-weight: 600; font-size: 17px; }
.crop-top .x { background: rgba(255,255,255,.14); color: #fff; }
.crop-hint { color: rgba(255,255,255,.72); font-size: 13px; margin: 0 16px 6px; min-height: 1.4em; }
.crop-hint.found { color: #7be0a6; }
#cropCv { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; cursor: grab; }
.crop-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 12px 16px 16px; }
.crop-bar .btn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); color: #fff; }
.crop-bar .btn.primary { background: #e2382a; border-color: #e2382a; color: #fff; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Stats tab */
.stats-view { display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--sheet); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h2 { margin: 0; font-family: var(--display); font-size: 17px; }
.panel .lede { margin: 0; color: var(--muted); font-size: 13px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chart .series { fill: none; stroke: var(--got); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--got); opacity: .12; }
.chart .endpoint { fill: var(--got); stroke: var(--sheet); stroke-width: 2; }
.chart .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 6px 9px; font-size: 12px; white-space: nowrap; pointer-events: none; }
.chart .tip b { font-family: var(--display); font-size: 14px; display: block; }
.movers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) { .movers { grid-template-columns: 1fr; } }
.movers h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mover { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.mover img, .mover .noimg { width: 36px; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 4px; background: var(--sleeve); }
.mover .mn { font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mover .ms { color: var(--muted); font-size: 12px; }
.mover .delta { font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; font-size: 14px; }
.delta.up { color: var(--got); } .delta.down { color: var(--accent); }
.delta small { display: block; font-family: var(--body); font-weight: 500; color: var(--muted); font-size: 11px; }
.months { display: flex; flex-direction: column; gap: 8px; }
.month { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: center; font-size: 13px; }
.month .ml { color: var(--muted); }
.month .bars { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.month .bar { display: flex; align-items: center; gap: 8px; }
.month .bar i { display: block; height: 8px; border-radius: 0 4px 4px 0; min-width: 2px; }
.month .bar.spent i { background: var(--muted); }
.month .bar.worth i { background: var(--got); }
.month .bar span { font-family: var(--display); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
.key { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.badge-card { border: 1px dashed var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; color: var(--muted); }
.badge-card b { font-family: var(--display); font-size: 14px; color: var(--muted); }
.badge-card small { font-size: 12px; }
.badge-card.earned { border: 1px solid var(--got); background: var(--got-soft); }
.badge-card.earned b { color: var(--ink); }
.badge-card .prog { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 6px; }
.badge-card .prog i { display: block; height: 100%; background: var(--got); }
